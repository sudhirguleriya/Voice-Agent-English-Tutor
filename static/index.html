<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>Voice Coach</h1>
    <span id="keyWarn" class="warn" hidden>No API key set on the server</span>
  </div>
  <nav>
    <button class="tab active" data-tab="live">Live</button>
    <button class="tab" data-tab="report">Daily report</button>
  </nav>
</header>

<main>
  <!-- LIVE -->
  <section id="live" class="panel active">
    <div class="mic-row">
      <button id="micBtn" class="mic" aria-pressed="false" title="Start / stop listening">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <div class="mic-info">
        <div id="status" class="status">Press the mic to start. It keeps listening until you stop it.</div>
        <div class="meter"><div id="level"></div><div id="thresh"></div></div>
        <div class="settings">
          <label><input type="checkbox" id="speakToggle"> Speak corrections aloud</label>
          <label>Pause before analysing
            <input type="range" id="silence" min="600" max="2500" step="100" value="1100">
            <span id="silenceVal">1.1s</span></label>
          <span id="queue" class="muted"></span>
        </div>
      </div>
    </div>

    <div class="today-strip">
      <div><b id="tUtt">0</b><span>sentences today</span></div>
      <div><b id="tMis">0</b><span>mistakes</span></div>
      <div><b id="tRate">–</b><span>mistakes / 100 words</span></div>
      <div><b id="tScore">–</b><span>avg score</span></div>
    </div>

    <div id="feed" class="feed"><p class="empty">Your sentences and feedback will appear here.</p></div>
  </section>

  <!-- REPORT -->
  <section id="report" class="panel">
    <div class="report-head">
      <label>Day <input type="date" id="reportDay"></label>
      <button id="refreshReport">Refresh</button>
      <button id="planBtn" class="primary">Generate practice plan</button>
    </div>
    <div id="reportBody"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
